version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace
    ports:
      - "9000:9000"
    command: php -S 0.0.0.0:9000 -t /workspace
    networks:
      - dev-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: your_database_name
    ports:
      - "3306:3306"
    networks:
      - dev-network

networks:
  dev-network:
