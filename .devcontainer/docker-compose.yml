version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    command: tail -f /dev/null
    networks:
      - dev-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: bpm_api
    ports:
      - "3306:3306"
    networks:
      - dev-network

networks:
  dev-network:
